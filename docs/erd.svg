<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="1240" height="810" rx="20" fill="#FFFFFF"/>

  <defs>
    <style>
      .attr { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #1E293B; }
      .key { font-size: 10px; font-weight: 800; }
      .lbl { font-size: 12px; font-weight: 800; fill: #475569; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; }
      .title { font-size: 18px; font-weight: 800; fill: #FFFFFF; }
      .titledark { font-size: 18px; font-weight: 800; fill: #1E293B; }
      .foot { font-size: 12px; font-weight: 700; fill: #64748B; }
      .sep { stroke: #E2E8F0; stroke-width: 1; }
      .wire { stroke: #64748B; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- connectors (under boxes) -->
  <g>
    <path class="wire" d="M320,90 H375 V110 H430"/>
    <text class="lbl" x="352" y="82" text-anchor="middle">drives</text>
    <path class="wire" d="M170,216 V300"/>
    <text class="lbl" x="170" y="262" text-anchor="middle">requests</text>
    <path class="wire" d="M170,20 V16 H990 V20"/>
    <text class="lbl" x="580" y="12" text-anchor="middle">drives</text>
    <path class="wire" d="M320,160 H375 V360 H430"/>
    <text class="lbl" x="375" y="262" text-anchor="middle">joins</text>
    <path class="wire" d="M250,20 V8 H1190 V780 H950 V756"/>
