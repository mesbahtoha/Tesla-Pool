    <path class="wire" d="M550,242 V300"/>
    <text class="lbl" x="550" y="275" text-anchor="middle">contains</text>
    <path class="wire" d="M840,220 H785 V528 H320"/>
    <text class="lbl" x="552" y="522" text-anchor="middle">groups</text>
    <path class="wire" d="M900,242 V300"/>
    <text class="lbl" x="900" y="275" text-anchor="middle">logs</text>
    <path class="wire" d="M320,390 H430"/>
    <text class="lbl" x="375" y="384" text-anchor="middle">seats</text>
